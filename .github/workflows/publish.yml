name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

# 最小権限: checkout 用の read と、NuGet.org Trusted Publishing 用の OIDC token 発行だけを許可する
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1 (pinned by SHA)

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0 (pinned by SHA)
        with:
          dotnet-version: '10.0.x'

      - name: Build VelopackUpdateDialog.Avalonia
        run: dotnet build src/VelopackUpdateDialog.Avalonia/VelopackUpdateDialog.Avalonia.csproj -c Release

      - name: Run download lifetime regression tests
        run: dotnet run --project tests/VelopackUpdateDialog.Avalonia.RegressionTests/VelopackUpdateDialog.Avalonia.RegressionTests.csproj -c Release

      - name: Pack VelopackUpdateDialog.Avalonia
        run: dotnet pack src/VelopackUpdateDialog.Avalonia/VelopackUpdateDialog.Avalonia.csproj -c Release --no-build

      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path artifacts -Filter 'VelopackUpdateDialog.Avalonia.*.nupkg' -File)
          if ($packages.Count -ne 1) {
            Write-Error "Expected exactly one VelopackUpdateDialog.Avalonia package, found $($packages.Count)."
            exit 1
          }
          dotnet nuget push $packages[0].FullName `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
